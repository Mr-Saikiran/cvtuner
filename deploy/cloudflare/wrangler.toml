name = "cvtuner"
main = "worker.js"
compatibility_date = "2026-10-31"

# only /cvtuner* goes to Vercel; everything else on techswitch.in stays as it is
routes = [
  { pattern = "techswitch.in/cvtuner*", zone_name = "techswitch.in" },
  { pattern = "www.techswitch.in/cvtuner*", zone_name = "techswitch.in" },
]

[vars]
ORIGIN = "https://cvtuner-kappa.vercel.app"
